name: Rafraichir les donnees

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours a 06:00 UTC
  workflow_dispatch: {}    # permet aussi un lancement manuel depuis GitHub

permissions:
  contents: write          # autorise le robot a committer/pousser

# Un seul robot a la fois : evite deux pushes simultanes (robot quotidien / robot rapide)
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Regenerer les donnees
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          python pipeline/sources/gas_source.py
          python pipeline/sources/oil_sources.py
          python pipeline/sources/oil_live.py
          python pipeline/sources/electricity_source.py
          python pipeline/analysis/risk_report.py
          python pipeline/analysis/oil_analysis.py
          python pipeline/analysis/gas_analysis.py
          python pipeline/analysis/elec_analysis.py
          python pipeline/sources/news_source.py
          python pipeline/analysis/maritime_analysis.py
          python pipeline/analysis/strategies_oil.py
          python pipeline/analysis/strategies_gas.py
          python pipeline/analysis/idees.py

      - name: Committer seulement si quelque chose a change
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "{\"maj\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > data/meta.json
            git config user.name "Luca Desplat"
            git config user.email "desplatluca@gmail.com"
            git add data/*.json
            git commit -m "Mise a jour automatique des donnees"
            git pull --rebase origin main
            git push
          else
            echo "Aucun changement a publier."
          fi
